# CrewDEV TURN Server Production Configuration
# Optimized for production deployment

# Basic server settings
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
listening-ip=::0

# External IP configuration (REQUIRED - set your public IP)
# external-ip=YOUR_PUBLIC_IP/PRIVATE_IP

# Server identification
realm=crewdev.com
server-name=crewdev-turn

# Authentication
use-auth-secret
static-auth-secret=CHANGE_THIS_SECRET_IN_PRODUCTION

# Logging
log-file=/var/log/coturn/coturn.log
verbose
no-stdout-log

# Security settings
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
no-tlsv1_2

# Performance settings
total-quota=2000
user-quota=100
stale-nonce=600
no-tcp-relay

# RTP/RTCP port range
min-port=40000
max-port=50000

# Network restrictions
allowed-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=127.0.0.1-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Enable STUN and TURN
stun-only
no-multicast-peers

# Relay settings
relay-ip=0.0.0.0
relay-ip=::0

# Certificate files (uncomment for SSL/TLS)
# cert=/etc/ssl/certs/coturn.crt
# pkey=/etc/ssl/private/coturn.key

# Additional security
no-loopback-peers
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
no-tlsv1_2

# Bandwidth limits
total-quota=2000
user-quota=100
