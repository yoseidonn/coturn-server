# CrewDEV TURN Server Development Configuration
# Optimized for development and testing

# Basic server settings
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
listening-ip=::0

# External IP configuration (REQUIRED - set your public IP)
# external-ip=YOUR_PUBLIC_IP/PRIVATE_IP

# Server identification
realm=crewdev-dev.com
server-name=crewdev-turn-dev

# Authentication
use-auth-secret
static-auth-secret=dev-secret-key-change-in-production

# Logging
log-file=/var/log/coturn/coturn-dev.log
verbose
no-stdout-log

# Security settings (relaxed for development)
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Performance settings (lower limits for dev)
total-quota=500
user-quota=25
stale-nonce=300
no-tcp-relay

# RTP/RTCP port range
min-port=49152
max-port=65535

# Network restrictions (more permissive for dev)
allowed-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=127.0.0.1-127.255.255.255
denied-peer-ip=::1

# Enable STUN and TURN
stun-only
no-multicast-peers

# Relay settings
relay-ip=0.0.0.0
relay-ip=::0

# Additional security (relaxed for dev)
no-loopback-peers
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Bandwidth limits (lower for dev)
total-quota=500
user-quota=25
