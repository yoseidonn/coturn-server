# CrewDEV TURN Server Configuration
# Simple packet forwarding for WebRTC NAT traversal

# Basic server settings
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
listening-ip=::0

# External IP configuration (REQUIRED - set your public IP)
# external-ip=YOUR_PUBLIC_IP/PRIVATE_IP
# Example: external-ip=203.0.113.1/192.168.1.100

# Server identification
realm=crewdev.com
server-name=crewdev-turn

# Authentication
use-auth-secret
static-auth-secret=crewdev-turn-secret-key-change-in-production

# Logging
log-file=/var/log/coturn/coturn.log
verbose
no-stdout-log

# Security settings
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
no-tlsv1_2

# Performance settings
total-quota=1000
user-quota=50
stale-nonce=600
no-tcp-relay

# RTP/RTCP port range
min-port=49152
max-port=65535

# Network restrictions
allowed-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=127.0.0.1-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Enable STUN and TURN
stun-only
no-multicast-peers

# Relay settings
relay-ip=0.0.0.0
relay-ip=::0

# Certificate files (uncomment for production)
# cert=/etc/ssl/certs/coturn.crt
# pkey=/etc/ssl/private/coturn.key

# Database (optional - using static auth)
# userdb=/etc/coturn/turndb

# Additional security
no-loopback-peers
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
no-tlsv1_2

# Bandwidth limits
total-quota=1000
user-quota=50
